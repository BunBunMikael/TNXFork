name: Build TranslateNX Live

# Put this file in your repo at:  .github/workflows/build.yml
# Run it from the Actions tab ("Run workflow") or by pushing to the repo.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch libraries (with retries)
        shell: bash
        run: |
          PKGS="switch-dev switch-curl switch-mbedtls switch-zlib switch-libjpeg-turbo switch-pkg-config switch-sdl2 switch-sdl2_ttf"

          # pkg.devkitpro.org sometimes answers 403 / 5xx to CI runners. No full upgrade (-u),
          # and retry the sync a few times with growing waits.
          ok=0
          for i in 1 2 3 4 5 6; do
            if dkp-pacman -Sy --noconfirm && dkp-pacman -S --needed --noconfirm $PKGS; then
              ok=1; break
            fi
            echo "Attempt $i failed, waiting $((i*30))s..."
            sleep $((i*30))
          done

          # Last resort: use the package databases already inside the container (no sync).
          if [ "$ok" != "1" ]; then
            echo "Sync kept failing, trying without database sync..."
            dkp-pacman -S --needed --noconfirm $PKGS
          fi

      - name: Build TranslateNX Live (make HUD=1)
        working-directory: overlay
        run: make HUD=1 -j"$(nproc)"

      - name: Build the settings app (TranslateNX.nro, for entering API keys)
        working-directory: app
        run: make -j"$(nproc)"

      - name: Upload translatenx_live.ovl
        uses: actions/upload-artifact@v4
        with:
          name: translatenx-live-ovl
          path: overlay/translatenx_live.ovl
          if-no-files-found: error

      - name: Upload TranslateNX.nro (settings app)
        uses: actions/upload-artifact@v4
        with:
          name: translatenx-settings-nro
          path: app/TranslateNX.nro
          if-no-files-found: error
